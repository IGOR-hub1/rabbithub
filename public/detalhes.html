    <style>
/* ============ DRAKSYON DESIGN TOKENS (compartilhados) ============ */
:root{
  --bg:#0d0d0f;
  --bg-elev-1:#111113;
  --bg-elev-2:#18181b;
  --surface:rgba(255,255,255,0.03);
  --surface-hover:rgba(255,255,255,0.06);
  --surface-strong:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.06);
  --border-strong:rgba(255,255,255,0.12);
  --text:#fff;
  --text-muted:#9aa0a6;
  --text-dim:#666;
  --text-faint:#555;
  --brand:#254BFF;
  --brand-2:#3A56F6;
  --brand-light:#5B7FFF;
  --brand-soft:rgba(37,75,255,0.12);
  --brand-soft-2:rgba(37,75,255,0.20);
  --brand-glow:rgba(37,75,255,0.35);
  --grad-brand:linear-gradient(90deg,#254BFF,#3A56F6);
  --grad-brand-135:linear-gradient(135deg,#254BFF,#3A56F6);
  --grad-brand-anim:linear-gradient(90deg,#254BFF,#3A56F6,#5B7FFF,#3A56F6,#254BFF);
  --shadow-sm:0 4px 12px rgba(0,0,0,0.35);
  --shadow-md:0 8px 24px rgba(0,0,0,0.45);
  --shadow-lg:0 20px 50px -12px rgba(0,0,0,0.8);
  --shadow-brand:0 8px 24px rgba(37,75,255,0.35);
  --shadow-brand-strong:0 12px 32px rgba(37,75,255,0.55);
  --r-sm:8px;
  --r-md:10px;
  --r-lg:12px;
  --r-xl:16px;
  --t-fast:.18s ease;
  --t-base:.25s cubic-bezier(.4,0,.2,1);
  --t-slow:.45s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-y:auto;
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.10);border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:rgba(91,127,255,0.35)}
::-webkit-scrollbar-track{background:transparent}

/* Foco acessível */
:focus-visible{outline:2px solid var(--brand-light);outline-offset:2px;border-radius:6px}
button,a{-webkit-tap-highlight-color:transparent}

/* Animações utilitárias */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes pulseGlow{0%,100%{box-shadow:0 6px 18px rgba(37,75,255,0.30)}50%{box-shadow:0 10px 28px rgba(37,75,255,0.55)}}
@keyframes gradientShift{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-up{animation:fadeUp .45s ease both}
.fade-in{animation:fadeIn .35s ease both}
.pop-in{animation:pop .35s cubic-bezier(.34,1.56,.64,1) both}

/* ============ HEADER ============ */
.otk-header-fixed{
  position:fixed;top:0;left:0;right:0;height:65px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;
  background:rgba(13,13,15,0.78);
  backdrop-filter:blur(16px) saturate(1.1);-webkit-backdrop-filter:blur(16px) saturate(1.1);
  border-bottom:1px solid var(--border);
  z-index:100;
}
.header-inner{
  width:100%;max-width:1200px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.header-title{font-size:clamp(16px,2.5vw,22px);font-weight:700;color:#fff;letter-spacing:1px;text-align:center;flex:1}
.header-right{display:flex;align-items:center;gap:8px}
.icon-btn{
  background:rgba(255,255,255,0.04);border:1px solid transparent;color:#fff;cursor:pointer;
  width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  transition:background var(--t-fast),border-color var(--t-fast),transform var(--t-fast);
}
.icon-btn:hover{background:rgba(255,255,255,0.08);border-color:var(--border)}
.icon-btn:active{transform:scale(.92)}

.server-indicator{
  font-size:10px;color:var(--brand-light);font-weight:700;
  padding:4px 9px;border-radius:6px;
  background:rgba(37,75,255,0.10);border:1px solid rgba(37,75,255,0.25);
  white-space:nowrap;letter-spacing:.5px;
}

/* ============ DRAWER ============ */
.drawer-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:150;
  opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.drawer-overlay.open{opacity:1;visibility:visible}
.drawer{
  position:fixed;top:0;left:0;bottom:0;width:280px;max-width:76vw;
  background:var(--bg-elev-1);z-index:200;
  transform:translateX(-100%);
  transition:transform .38s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
  border-right:1px solid var(--border);
  overflow-y:auto;
  box-shadow:8px 0 32px rgba(0,0,0,0.5);
}
.drawer.open{transform:translateX(0)}
.drawer-top{
  padding:20px 16px 14px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.drawer-brand-row{display:flex;align-items:center;gap:10px}
.drawer-brand-logo{
  width:38px;height:38px;border-radius:10px;
  background:var(--grad-brand-135);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(37,75,255,0.35);overflow:hidden;
}
.drawer-brand-logo img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.drawer-brand-title{font-size:15px;font-weight:700;color:#fff;letter-spacing:.5px}
.drawer-close-btn{
  background:rgba(255,255,255,0.04);border:none;color:#aaa;
  width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all var(--t-fast);
}
.drawer-close-btn:hover{color:#fff;background:rgba(255,255,255,0.10)}
.drawer-close-btn:active{transform:scale(.9)}
.drawer-nav{list-style:none;padding:10px 8px 0}
.drawer-nav-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 12px;border-radius:10px;cursor:pointer;
  color:#9aa0a6;font-size:14px;font-weight:500;
  transition:background var(--t-fast),color var(--t-fast),transform var(--t-fast);
  border:none;background:none;width:100%;text-align:left;text-decoration:none;
  position:relative;
}
.drawer-nav-item::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:0;border-radius:2px;background:var(--brand);
  transition:height var(--t-base);
}
.drawer-nav-item:hover{background:rgba(255,255,255,0.04);color:#e5e5e5}
.drawer-nav-item:active{transform:scale(.98)}
.drawer-nav-item.active{background:var(--brand-soft);color:#fff}
.drawer-nav-item.active::before{height:60%}
.drawer-nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.65;transition:opacity var(--t-fast)}
.drawer-nav-item:hover svg{opacity:.95}
.drawer-nav-item.active svg{opacity:1;color:var(--brand-light)}
li + li .drawer-nav-item{margin-top:2px}
.drawer-divider{height:1px;background:var(--border);margin:8px 16px}
.drawer-section-label{padding:12px 16px 6px;font-size:11px;font-weight:700;color:var(--text-faint);letter-spacing:1.2px;text-transform:uppercase}
/* Drawer submenu (Filmes) */
.drawer-group-toggle{position:relative}
.drawer-group-caret{width:14px!important;height:14px!important;margin-left:auto;opacity:.6;transition:transform var(--t-base),opacity var(--t-fast)}
.drawer-group.open .drawer-group-caret{transform:rotate(180deg);opacity:1}
.drawer-submenu{list-style:none;margin:4px 8px 6px;padding:6px 4px;max-height:0;overflow:hidden;border-radius:10px;background:rgba(255,255,255,0.025);border:1px solid transparent;opacity:0;transform:translateY(-4px);transition:max-height .35s ease,opacity .25s ease,transform .25s ease,border-color .25s ease,padding .25s ease}
.drawer-group.open .drawer-submenu{max-height:240px;opacity:1;transform:translateY(0);border-color:var(--border);padding:8px 6px}
.drawer-subnav-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 14px 9px 18px;background:transparent;border:none;color:var(--text-muted);font-size:13.5px;font-weight:500;text-align:left;cursor:pointer;border-radius:8px;transition:background var(--t-fast),color var(--t-fast),transform var(--t-fast);text-decoration:none}
.drawer-subnav-item:hover{background:rgba(255,255,255,0.05);color:#e5e5e5}
.drawer-subnav-item:active{transform:scale(.98)}
.drawer-subnav-item.active{background:var(--brand-soft);color:#fff}
.drawer-bullet{width:6px;height:6px;border-radius:50%;background:var(--text-faint);flex-shrink:0;transition:background var(--t-fast),box-shadow var(--t-fast)}
.drawer-subnav-item:hover .drawer-bullet{background:#bbb}
.drawer-subnav-item.active .drawer-bullet{background:var(--brand-light);box-shadow:0 0 8px var(--brand-glow)}
li + li .drawer-subnav-item{margin-top:2px}
a.drawer-nav-item,a.drawer-subnav-item{text-decoration:none}
.server-option{
  display:flex;align-items:center;gap:12px;
  padding:11px 12px;border-radius:10px;cursor:pointer;
  color:#9aa0a6;font-size:13px;font-weight:500;
  transition:all var(--t-fast);border:none;background:none;width:100%;text-align:left;
}
.server-option:hover{background:rgba(255,255,255,0.04);color:#ddd}
.server-option:active{transform:scale(.98)}
.server-option.active{background:var(--brand-soft);color:#fff}
.server-radio{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color var(--t-fast)}
.server-option.active .server-radio{border-color:var(--brand)}
.server-radio-dot{width:8px;height:8px;border-radius:50%;background:var(--brand);display:none}
.server-option.active .server-radio-dot{display:block;animation:pop .25s ease}
.server-name{flex:1}
.server-badge{font-size:10px;padding:3px 8px;border-radius:6px;background:rgba(37,75,255,0.18);color:var(--brand-light);font-weight:700;letter-spacing:.5px}
.drawer-footer{margin-top:auto;padding:14px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.drawer-avatar{width:38px;height:38px;border-radius:50%;background:#1a1a1e;background-size:cover;background-position:center;flex-shrink:0;border:2px solid var(--border-strong)}
.drawer-user-info{display:flex;flex-direction:column;gap:1px;flex:1}
.drawer-user-name{font-size:14px;font-weight:600;color:#ddd}
.drawer-user-role{font-size:11px;color:var(--text-faint)}


/* ============ DETALHES ============ */
body{padding-top:65px}

/* Hero area */
.hero-area{
  position:relative;overflow:hidden;
  padding:32px 20px 0;
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(36px) saturate(1.3);opacity:.25;transform:scale(1.35)}
.hero-gradient{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,13,15,0.25) 0%,rgba(13,13,15,0.7) 55%,rgba(13,13,15,1) 100%)}
.hero-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;max-width:600px;width:100%;animation:fadeUp .55s ease}
.hero-poster{
  width:170px;height:245px;border-radius:16px;object-fit:contain;background:#111318;
  border:2px solid rgba(255,255,255,0.08);
  box-shadow:var(--shadow-lg),0 0 0 1px rgba(255,255,255,0.04);
  transition:transform var(--t-base);
}
.hero-poster:hover{transform:translateY(-4px) scale(1.02)}
.anime-title{
  font-size:clamp(18px,5vw,28px);font-weight:700;color:#fff;line-height:1.35;
  margin-top:20px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 2px 18px rgba(0,0,0,0.5);
}

/* Assistir button */
.btn-assistir-main{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;max-width:420px;margin-top:20px;padding:15px 22px;
  background:var(--grad-brand-anim);background-size:200% 100%;
  color:#fff;border:none;border-radius:14px;
  font-size:16px;font-weight:700;cursor:pointer;
  box-shadow:var(--shadow-brand);
  transition:box-shadow var(--t-base),transform var(--t-fast);
  text-decoration:none;
  animation:gradientShift 5s linear infinite alternate;
}
.btn-assistir-main:hover{box-shadow:var(--shadow-brand-strong);transform:translateY(-2px)}
.btn-assistir-main:active{transform:scale(.97)}
.btn-assistir-main svg{width:20px;height:20px}

/* Stats row no hero */
.anime-stats{
  display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
  margin-top:14px;
}
.anime-stat-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:99px;
  background:rgba(255,255,255,0.05);border:1px solid var(--border-strong);
  font-size:11px;color:#ddd;font-weight:700;letter-spacing:.4px;
  backdrop-filter:blur(8px);
}
.anime-stat-chip svg{width:12px;height:12px;color:var(--brand-light)}
.anime-stat-chip.gold svg{color:#fbbf24}
.anime-stat-chip.live{background:rgba(34,197,94,0.10);border-color:rgba(34,197,94,0.3);color:#86efac}
.anime-stat-chip.live svg{color:#22c55e}

.anime-subtitle{margin-top:14px;font-size:13px;color:var(--text-muted);line-height:1.55;padding-bottom:24px}
.btn-assistir-main.is-disabled{display:none}

.main-content{max-width:1100px;margin:0 auto;padding:0 16px 30px}
.detail-feedback{
  display:none;align-items:center;justify-content:space-between;gap:14px;
  margin:0 0 22px;padding:13px 15px;border-radius:12px;

            var date = displayValue(episode.data || episode.date || episode.publicadoEm || episode.descricao);
            var thumbnail = displayValue(episode.capa || episode.thumbnail || episode.imagem || animeMeta.capa);
            var fillerInfo = aiFillerForEpisode(episode,canonicalIndex);
            var card = document.createElement('a');
            card.className = 'ep-card';
            card.setAttribute('aria-label', 'Assistir ' + displayTitle);
            if (episode.link) card.href = playerHref(episode);
            else {
                card.setAttribute('aria-disabled', 'true');
                card.tabIndex = -1;
            }
            card.innerHTML =
                '<div class="ep-card-thumb' + (thumbnail ? '' : ' no-image') + '">' +
                    (thumbnail ? '<img src="' + escapeAnimeHtml(thumbnail) + '" loading="lazy" decoding="async" alt="" onerror="this.style.display=\'none\';this.parentNode.classList.add(\'no-image\')">' : '') +
                    '<span class="ep-thumb-fallback">' + escapeAnimeHtml('EP.' + (displayValue(episode.numero) || String(canonicalIndex + 1))) + '</span>' +
                    '<span class="ep-card-play" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="7 4 20 12 7 20 7 4"/></svg></span>' +
                '</div>' +
                '<div class="ep-card-info">' +
                    '<div class="ep-card-title">' + escapeAnimeHtml(displayTitle) + '</div>' +
                    '<div class="ep-card-status">' + escapeAnimeHtml(audio) + (fillerInfo?' <span class="ep-card-filler" title="'+escapeAnimeHtml(fillerInfo.reason||'Classificado pela IA')+'">FILLER • IA</span>':'') + '</div>' +
                    (date ? '<time class="ep-card-date">' + escapeAnimeHtml(date) + '</time>' : '') +
                '</div>';
            card.addEventListener('click', function(event){
                if (!episode.link) { event.preventDefault(); return; }
                pushHistory({ slug: animeSlug, titulo: animeMeta.titulo, capa: animeMeta.capa, epNome: title, epIdx: canonicalIndex, ts: Date.now(), progresso: 5 });
            });
            bindEpisodePrefetch(card,episode);
            fragment.appendChild(card);
        });
        lista.appendChild(fragment);
        updateEpisodeLoader(episodes.length, episodesToRender.length);
    }
    function renderFirstEpisode() {
        var button = document.getElementById('btn-assistir-primeiro');
        var firstEpisode = episodesForSelectedSeason().filter(function(episode) { return !!episode.link; })[0];
        if (!firstEpisode || !firstEpisode.link) {
            button.classList.add('is-disabled');
            button.removeAttribute('href');
            button.setAttribute('aria-disabled','true');
            button.onclick = null;
            return;
        }
        var index = canonicalEpisodeIndex(firstEpisode);
        var title = episodeTitle(firstEpisode, index);
        button.classList.remove('is-disabled');
        button.setAttribute('aria-disabled','false');
        button.href = playerHref(firstEpisode);
        document.getElementById('btn-assistir-label').textContent = 'Assistir ' +
            (selectedSeason === null ? '' : seasonLabel(selectedSeason, true) + ' · ') + title;
        button.onclick = function(){
            pushHistory({ slug: animeSlug, titulo: animeMeta.titulo, capa: animeMeta.capa, epNome: title, epIdx: index, ts: Date.now(), progresso: 5 });
        };
        bindEpisodePrefetch(button,firstEpisode);
        scheduleEpisodePrefetch(firstEpisode);
    }
    function renderDetails(data, state) {
        state = state || {};
        activeData = mergeAnimeData(activeData, data || {});
        var title = displayValue(field(activeData, ['titulo','title','nome']));
        if (placeholderTitle(title)) title = '';
        var cover = displayValue(field(activeData, ['capa','cover','poster','image']));
        var backdrop = displayValue(field(activeData, ['backdrop','banner','background']));
        var synopsis = displayValue(field(activeData, ['sinopse','synopsis','descricao','description','overview','plot']));
        var subtitle = displayValue(field(activeData, ['subtitulo','subtitle','tituloAlternativo','alternativeTitle','tituloOriginal','originalTitle']));
        animeMeta = { titulo: title || animeMeta.titulo || '', capa: cover || animeMeta.capa || '' };

        document.getElementById('titulo').textContent = animeMeta.titulo || (state.failed ? 'Detalhes indisponíveis' : 'Carregando anime...');
        if (animeMeta.titulo) document.title = animeMeta.titulo + ' — RabbitHub Animes';
        var descriptionMeta = document.querySelector('meta[name="description"]');
        if (descriptionMeta && synopsis) descriptionMeta.content = synopsis.slice(0,155);
        setPoster(animeMeta.capa, !!state.failed || !!state.loaded, backdrop);
        document.getElementById('anime-subtitle').textContent = subtitle || (state.loaded && animeMeta.titulo ? 'Assistir ' + animeMeta.titulo + ' online' : '');
        document.getElementById('sinopse').textContent = synopsis ||
            (state.failed ? 'A descrição não pôde ser atualizada agora.' : state.loaded ? 'Descrição não informada.' : 'Buscando descrição...');

        var episodes = field(activeData, ['episodios','episodes']);
        if (Array.isArray(episodes)) allEpisodes = episodes.slice();
        renderStats(activeData);
        renderGenres(activeData);
        renderSeasonPicker();
        renderFirstEpisode();
        renderEpisodes();
        analyzeFillers();
        isFav = isFavSlug(animeSlug);
        updateFavUI();
        updateReleaseAlertUI();
        showContent();
    }
    function savePreview(data) {
        try {
            var compact = {
                slug: animeSlug,
                titulo: field(data, ['titulo','title','nome']),
                capa: field(data, ['capa','cover','poster','image']),
                backdrop: field(data, ['backdrop','banner','background']),
                sinopse: field(data, ['sinopse','synopsis','descricao','description','overview','plot']),
                generos: field(data, ['generos','genres']),
                score: field(data, ['score','nota','voteAverage']),
                status: field(data, ['status','situacao','releaseStatus']),
                audio: field(data, ['audio','audios','idioma','language']),
                ano: field(data, ['ano','year','releaseYear']),
                temporadas: field(data, ['temporadas','seasonCount','seasonsCount']),
                classificacao: field(data, ['classificacao','classificação','ageRating','contentRating']),
                formato: field(data, ['formato','format','mediaType']),
                duracao: field(data, ['duracao','duration','runtime']),
                ts: Date.now()
            };
            sessionStorage.setItem(PREVIEW_KEY, JSON.stringify(compact));
            sessionStorage.setItem(PREVIEW_KEY + ':' + animeSlug, JSON.stringify(compact));
        } catch (e) {}
    }
    function hasRealDetails(data) {
        if (!data || typeof data !== 'object') return false;
        var title = displayValue(field(data, ['titulo','title','nome']));
        return (!placeholderTitle(title) && !!title) || !!field(data, ['capa','cover','poster','image']) ||
            !!field(data, ['sinopse','synopsis','descricao','description','overview','plot']) ||
            (Array.isArray(field(data, ['episodios','episodes'])) && field(data, ['episodios','episodes']).length > 0);
    }
    async function carregar() {
        if (!animeSlug) {
            document.getElementById('loading').textContent = 'Nenhum anime selecionado.';
            return;
        }
        var serial = ++loadSerial;
        if (Object.keys(activeData).length) {
            showFeedback('Atualizando informações do anime…', '', false);
        } else {
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('loading').textContent = 'Carregando detalhes...';
        }
        try {
            if (!window.AF || typeof window.AF.detalhes !== 'function') throw new Error('Adaptador do Meus Animes indisponível.');
            var data = await window.AF.detalhes(animeSlug);
            if (serial !== loadSerial) return;
            if (!hasRealDetails(data)) throw new Error('O Meus Animes devolveu uma página sem detalhes.');
            if (data.slug) animeSlug = normalizeAnimeIdentifier(data.slug) || animeSlug;
            activeData = mergeAnimeData(activeData, data);
            renderDetails(activeData, { loaded:true });
            savePreview(activeData);
            showFeedback('', '', false);
        } catch (error) {
            if (serial !== loadSerial) return;
            console.error('Falha ao atualizar detalhes:', error);
            renderDetails(activeData, { failed:true });
            showFeedback('Não foi possível atualizar os detalhes agora. As informações já carregadas foram mantidas.', 'error', true);
        }
    }

    function updateFavUI(){
        var btn = document.getElementById('fav-btn');
        if(isFav){
            btn.classList.add('active');
            btn.setAttribute('aria-pressed','true');
            btn.setAttribute('aria-label','Remover da Minha Lista');
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg> NA MINHA LISTA';
        } else {
            btn.classList.remove('active');
            btn.setAttribute('aria-pressed','false');
            btn.setAttribute('aria-label','Adicionar à Minha Lista');
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg> ADICIONAR À LISTA';
        }
    }

    function updateReleaseAlertUI(){
        var button=document.getElementById('release-alert-btn');if(!button)return;
        var subscribed=window.RabbitHubFeatures&&window.RabbitHubFeatures.findAlert&&window.RabbitHubFeatures.findAlert(animeSlug);
        var allowed=window.RabbitHubPlans&&window.RabbitHubPlans.can&&window.RabbitHubPlans.can('releaseAlerts');
        button.classList.toggle('active',!!subscribed);button.classList.toggle('locked',!allowed);
        button.setAttribute('aria-pressed',subscribed?'true':'false');
        var label=button.querySelector('span');if(label)label.textContent=subscribed?'AVISOS ATIVADOS':'AVISAR NOVOS EPISÓDIOS';
    }

    document.getElementById('fav-btn').addEventListener('click', function(){
        isFav = !isFav;
        setFav(animeSlug, animeMeta, isFav);
        updateFavUI();
    });
    document.getElementById('release-alert-btn').addEventListener('click',function(){
        var allowed=window.RabbitHubPlans&&window.RabbitHubPlans.can&&window.RabbitHubPlans.can('releaseAlerts');
        if(!allowed){showFeedback('Os alertas de novos episódios estão disponíveis no plano VIP.','',false);return;}
        var active=!!window.RabbitHubFeatures.findAlert(animeSlug),button=this;button.disabled=true;
        window.RabbitHubFeatures.setAlert({slug:animeSlug,title:animeMeta.titulo,cover:animeMeta.capa,lastCount:allEpisodes.length},!active).then(function(){
            updateReleaseAlertUI();showFeedback(active?'Avisos desativados para este anime.':'Você receberá um aviso quando houver episódio novo.','',false);
        }).then(function(){button.disabled=false;});
    });
    document.addEventListener('rh:planchange',updateReleaseAlertUI);
    document.getElementById('detail-retry').addEventListener('click', carregar);
    document.getElementById('btn-ordenar').addEventListener('click', function() {
        sortDescending = !sortDescending;
        resetEpisodeWindow();
        this.setAttribute('aria-label', sortDescending ? 'Mostrar mais antigos primeiro' : 'Mostrar mais recentes primeiro');
        this.setAttribute('title', sortDescending ? 'Mais antigos primeiro' : 'Mais recentes primeiro');
        renderEpisodes();
    });
    document.getElementById('season-select').addEventListener('change', function(event) {
        selectedSeason = Number(event.target.value);
        resetEpisodeWindow();
        syncSeasonPicker();
        renderFirstEpisode();
        renderEpisodes();
    });
    document.getElementById('ep-search').addEventListener('input', function(event) {
        episodeQuery = (event.target.value || '').trim();
        resetEpisodeWindow();
        renderEpisodes();
    });
    document.getElementById('ep-load-more-btn').addEventListener('click', loadNextEpisodeBatch);
    window.addEventListener('scroll', function() {
        if (episodeQuery || episodeLoadScheduled || 'IntersectionObserver' in window) return;
        var loader = document.getElementById('ep-load-more');
        if (!loader || loader.hidden) return;
        if (loader.getBoundingClientRect().top <= (window.innerHeight || document.documentElement.clientHeight) + 420) {
            loadNextEpisodeBatch();
        }
    }, { passive:true });
    document.getElementById('ep-search').addEventListener('keydown', function(event) {
        if (event.key !== 'Enter') return;
        var episodes = visibleEpisodes();
        if (episodes[0] && episodes[0].link) window.location.href = playerHref(episodes[0]);
    });

    activeData = readPreview();
    if (Object.keys(activeData).some(function(key){ return useful(activeData[key]) && key !== 'slug'; })) {
        renderDetails(activeData, { preview:true });
        showFeedback('Atualizando informações do anime…', '', false);
    }
    carregar();
    </script>
<script>
    // Toggle do submenu "Filmes" no drawer (igual home)
    (function(){
        var fGroup = document.getElementById('drawer-group-filmes');
        var fToggle = document.getElementById('filmes-toggle');
        if(fGroup && fToggle){
            fToggle.addEventListener('click', function(e){
                e.preventDefault();
                var open = fGroup.classList.toggle('open');
                fToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            });
        }
    })();
</script>
</body>
