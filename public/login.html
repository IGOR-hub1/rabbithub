<style>
:root{
  --bg:#0d0d0f;
  --bg-elev-1:#111113;
  --bg-elev-2:#18181b;
  --surface:rgba(255,255,255,0.03);
  --border:rgba(255,255,255,0.06);
  --border-strong:rgba(255,255,255,0.12);
  --text:#fff;
  --text-muted:#9aa0a6;
  --text-dim:#666;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;align-items:flex-start;justify-content:center;
  padding:24px 16px;
  -webkit-font-smoothing:antialiased;
}

.card{
  width:100%;max-width:460px;
  background:var(--bg-elev-1);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 20px 50px -12px rgba(0,0,0,0.8);
  margin-top:24px;
}

/* Header */
.card-head{
  display:flex;align-items:center;gap:12px;
  padding:18px 20px;
  border-bottom:1px solid var(--border);
}
.head-logo{
  width:42px;height:42px;border-radius:50%;
  overflow:hidden;flex-shrink:0;
  border:1px solid var(--border-strong);
  background:var(--bg-elev-2);
}
.head-logo img{width:100%;height:100%;object-fit:cover;display:block}
.head-text{flex:1;min-width:0}
.head-title{font-size:16px;font-weight:800;letter-spacing:.3px;color:#fff}
.head-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.head-close{
  width:36px;height:36px;border-radius:50%;
  background:transparent;border:1px solid var(--border-strong);
  color:var(--text-muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;transition:.18s;flex-shrink:0;
}
.head-close:hover{color:#fff;background:rgba(255,255,255,.05)}
.head-close svg{width:16px;height:16px}

/* Body */
.card-body{padding:22px 20px 24px}

.field{margin-bottom:16px}
.field-label{
  display:block;font-size:13px;font-weight:700;
  color:#fff;margin-bottom:8px;letter-spacing:.2px;
}
.name-row{display:none;margin-bottom:16px}
.name-row.show{display:block}
.name-row .field{margin-bottom:0}

.signup-avatar{display:none;margin:2px 0 18px}
.signup-avatar.show{display:block}
.signup-avatar-label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.signup-avatar-label strong{color:#fff;font-size:13px;font-weight:750}
.signup-avatar-label small{color:var(--text-muted);font-size:10px}
.signup-avatar-layout{display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center;gap:14px;padding:12px;border:1px solid var(--border);border-radius:13px;background:rgba(255,255,255,.018)}
.signup-avatar-preview{width:72px;height:72px;overflow:hidden;border:1px solid rgba(255,255,255,.14);border-radius:50%;background:#1b1b20}
.signup-avatar-preview img{display:block;width:100%;height:100%;object-fit:cover}
.signup-avatar-actions{display:flex;min-width:0;flex-direction:column;align-items:stretch;gap:7px}
.signup-avatar-url{min-width:0;padding:11px 12px;font-size:12px}
.signup-avatar-remove{padding:2px 0;border:0;background:transparent;color:var(--text-muted);font:650 10px/1 inherit;cursor:pointer}
.signup-avatar-remove[hidden]{display:none}
.signup-avatar-note{margin:8px 2px 0;color:#777e8c;font-size:10px;line-height:1.45}

.input-wrap{position:relative}
.input{
  width:100%;background:var(--bg-elev-2);
  border:1px solid var(--border-strong);color:#fff;
  font-size:14.5px;padding:14px 14px;border-radius:10px;
  outline:none;transition:border-color .18s, box-shadow .18s;
}
.input::placeholder{color:var(--text-dim)}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

.pw-input{padding-right:78px}
.pw-toggle{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:transparent;border:none;color:var(--brand-light);
  font-size:13.5px;font-weight:700;cursor:pointer;
  padding:6px 8px;border-radius:6px;
}
.pw-toggle:hover{background:var(--brand-soft)}

.btn{
  width:100%;padding:15px;border:none;border-radius:10px;cursor:pointer;
  font-size:15px;font-weight:800;letter-spacing:.3px;color:#fff;
  background:var(--grad-brand-135);box-shadow:var(--shadow-brand);
  transition:transform .12s, box-shadow .18s;
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-top:4px;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-brand-strong)}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.65;cursor:not-allowed}
.btn .spin{
  width:16px;height:16px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;
}
.btn.loading .spin{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

.hint{
  text-align:center;font-size:12.5px;color:var(--text-muted);
  margin-top:14px;
}
.switch-line{
  text-align:center;font-size:13.5px;color:var(--text-muted);
  margin-top:18px;
}
.switch-line button{
  padding:0;border:0;background:transparent;font:inherit;
  color:var(--brand-light);font-weight:800;cursor:pointer;
  margin-left:4px;text-decoration:none;
}
.switch-line button:hover{text-decoration:underline}

.forgot-line{
  text-align:right;margin-top:-8px;margin-bottom:16px;
}
.forgot-line button{
  padding:0;border:0;background:transparent;
  font-size:12.5px;color:var(--brand-light);font-weight:700;
  cursor:pointer;text-decoration:none;
}
.forgot-line button:hover{text-decoration:underline}

.msg{
  font-size:12.5px;padding:11px 12px;border-radius:8px;
  margin-bottom:14px;display:none;line-height:1.4;
}
.msg.err{display:block;background:rgba(220,38,38,.10);border:1px solid rgba(220,38,38,.35);color:#fca5a5}
.msg.ok{display:block;background:rgba(22,163,74,.10);border:1px solid rgba(22,163,74,.35);color:#86efac}
</style>

<body data-page="login">

<main class="card">
  <div class="card-head">
    <div class="head-logo"><img data-dk-logo src="img/logo-blue.jpg" alt="RabbitHub Animes" /></div>
    <div class="head-text">
      <div class="head-title" id="head-title">RabbitHub <span style="color:var(--brand-light)">•</span> ANIMES</div>
      <div class="head-sub" id="head-sub">Entre ou crie sua conta</div>
    </div>
    <a href="index.html" class="head-close" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </a>
  </div>

  <div class="card-body">
    <div class="msg" id="msg" role="status" aria-live="polite" aria-atomic="true"></div>

    <form id="form" autocomplete="on">
      <div class="name-row" id="name-row">
        <div class="field">
          <label class="field-label" for="firstname">Nome do perfil</label>
          <input type="text" class="input" id="firstname" maxlength="24" autocomplete="nickname" placeholder="Como você quer aparecer?" />
        </div>
      </div>

      <div class="signup-avatar" id="signup-avatar">
        <div class="signup-avatar-label"><strong>Foto do perfil</strong><small>Cole o link da imagem</small></div>
        <div class="signup-avatar-layout">
          <div class="signup-avatar-preview"><img id="signup-avatar-preview" src="img/logo-blue.jpg" alt="Foto escolhida para o perfil" /></div>
          <div class="signup-avatar-actions">
            <input class="input signup-avatar-url" id="signup-avatar-url" type="url" inputmode="url" autocomplete="url" placeholder="https://site.com/foto.jpg" aria-label="Link da foto de perfil" />
            <button class="signup-avatar-remove" id="signup-avatar-remove" type="button" hidden>Usar logo do RabbitHub</button>
          </div>
        </div>
        <p class="signup-avatar-note">Use um link direto para uma imagem. Se deixar vazio, usaremos o logo do RabbitHub.</p>
      </div>

      <div class="field">
        <label class="field-label" for="email">E-mail</label>
        <div class="input-wrap">
          <input type="email" class="input" id="email" required maxlength="160" autocomplete="email" inputmode="email" placeholder="seu.email@exemplo.com" />
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="password">Senha</label>
        <div class="input-wrap">
          <input type="password" class="input pw-input" id="password" required minlength="6" autocomplete="current-password" placeholder="••••••••" />
          <button type="button" class="pw-toggle" id="pw-toggle" aria-pressed="false" aria-label="Mostrar senha">Mostrar</button>
        </div>
      </div>

      <div class="forgot-line" id="forgot-line"><button type="button" id="forgot">Esqueci minha senha</button></div>

      <button class="btn" id="submit" type="submit">
        <span class="spin"></span>
        <span class="lbl">Entrar</span>
      </button>

      <p class="hint" id="hint">Use seu e-mail e senha para acessar sua conta.</p>
    </form>

    <p class="switch-line" id="switch-line">Ainda não tem conta? <button type="button" data-mode="signup">Criar conta</button></p>
  </div>
</main>

<script>
(function(){
  var mode = 'login';
  var msg = document.getElementById('msg');
  var pw  = document.getElementById('password');
  var btn = document.getElementById('submit');
  var lbl = btn.querySelector('.lbl');
  var em  = document.getElementById('email');
  var firstName = document.getElementById('firstname');
  var nameRow = document.getElementById('name-row');
  var signupAvatar = document.getElementById('signup-avatar');
  var avatarPreview = document.getElementById('signup-avatar-preview');
  var avatarUrl = document.getElementById('signup-avatar-url');
  var avatarRemove = document.getElementById('signup-avatar-remove');
  var pwToggle = document.getElementById('pw-toggle');
  var DEFAULT_AVATAR = 'img/logo-blue.jpg';
  var selectedAvatar = DEFAULT_AVATAR;
  var submitting = false;

  function safeAvatarUrl(value){
    value=String(value||'').trim();
    if(!value)return '';
    try{
      var parsed=new URL(value);
      if(parsed.protocol==='https:'||parsed.protocol==='http:')return parsed.href;
    }catch(error){}
    return null;
  }
  function resetAvatar(){
    selectedAvatar=DEFAULT_AVATAR;avatarUrl.value='';avatarPreview.src=DEFAULT_AVATAR;avatarRemove.hidden=true;
  }
  avatarRemove.addEventListener('click',resetAvatar);
  avatarUrl.addEventListener('input',function(){
    var raw=avatarUrl.value.trim(),normalized=safeAvatarUrl(raw);
    selectedAvatar=normalized||DEFAULT_AVATAR;
    avatarPreview.src=selectedAvatar;
    avatarRemove.hidden=!raw;
  });
  avatarPreview.addEventListener('error',function(){if(!avatarPreview.src.endsWith('/img/logo-blue.jpg'))avatarPreview.src=DEFAULT_AVATAR;});

  pwToggle.addEventListener('click', function(){
    var isPw = pw.type === 'password';
    pw.type = isPw ? 'text' : 'password';
    pwToggle.textContent = isPw ? 'Ocultar' : 'Mostrar';
    pwToggle.setAttribute('aria-pressed',isPw ? 'true' : 'false');
    pwToggle.setAttribute('aria-label',isPw ? 'Ocultar senha' : 'Mostrar senha');
  });

  function setMode(m){
    mode = m;
    lbl.textContent = m === 'signup' ? 'Criar conta' : 'Entrar';
    pw.setAttribute('autocomplete', m === 'signup' ? 'new-password' : 'current-password');
    pw.setAttribute('placeholder', m === 'signup' ? 'Mínimo de 6 caracteres' : '••••••••');
    nameRow.classList.toggle('show', m === 'signup');
    signupAvatar.classList.toggle('show', m === 'signup');
    firstName.required = m === 'signup';
    document.getElementById('forgot-line').hidden = m === 'signup';
    document.getElementById('head-sub').textContent = m === 'signup' ? 'Crie sua conta gratuita' : 'Entre na sua conta';
    document.title = (m === 'signup' ? 'Criar conta' : 'Entrar') + ' — RabbitHub Animes';
    document.getElementById('hint').textContent = m === 'signup'
      ? 'Seu e-mail terá um único perfil com o nome e a foto escolhidos acima.'
      : 'Use seu e-mail e senha para acessar sua conta.';
    document.getElementById('switch-line').innerHTML = m === 'signup'
      ? 'Já tem conta? <button type="button" data-mode="login">Entrar</button>'
      : 'Ainda não tem conta? <button type="button" data-mode="signup">Criar conta</button>';
    msg.className = 'msg';
    bindModeLinks();
  }
  function bindModeLinks(){
    document.querySelectorAll('[data-mode]').forEach(function(el){
      el.onclick = function(){ setMode(el.dataset.mode); };
    });
  }
  bindModeLinks();

  function show(type, text){ msg.className = 'msg ' + type; msg.textContent = text; }

  function ensureInit(){
    if (!window.firebase || !firebase.auth || !firebase.database) return false;
    if (!window.__DK_FB_INIT__) {
      try { firebase.initializeApp(window.DK_FIREBASE_CONFIG); window.__DK_FB_INIT__ = true; }
      catch(e){ window.__DK_FB_INIT__ = true; }
    }
    return true;
  }

  function accountProfiles(data){
    var source = data && data.profiles;
    if (Array.isArray(source)) return source.filter(Boolean);
    if (source && typeof source === 'object') return Object.keys(source).map(function(key){
      var item=source[key];
      return item&&typeof item==='object' ? Object.assign({id:item.id||key},item) : null;
    }).filter(Boolean);
    return [];
  }

  function singleProfile(data){
    data=data||{};
    var oldActive={};
    try{oldActive=JSON.parse(localStorage.getItem('dk_active_profile')||'{}')||{};}catch(e){}
    var profiles=accountProfiles(data),chosen=null;
    if(oldActive.id) chosen=profiles.filter(function(item){return String(item.id||item.profileId||'')===String(oldActive.id);})[0]||null;
    chosen=chosen||data.profile||profiles[0]||{};
    return {
      id:String(chosen.id||chosen.profileId||'principal'),
      name:String(chosen.name||chosen.profileName||data.profileName||data.displayName||'Perfil').trim().slice(0,24)||'Perfil',
      avatar:String(chosen.avatar||chosen.profileAvatar||data.profileAvatar||DEFAULT_AVATAR).trim(),
      bio:String(chosen.bio||data.bio||'').trim().slice(0,280),
      banner:String(chosen.banner||'default'),theme:String(chosen.theme||'blue')
    };
  }

  function activateSingleProfile(uid,profile){
    localStorage.setItem('dk_active_profile',JSON.stringify(profile));
    localStorage.setItem('dk_profiles_'+String(uid||'anon'),JSON.stringify([profile]));
    try{document.dispatchEvent(new CustomEvent('dk:profilechange',{detail:profile}));}catch(e){}
  }

  function sessionFrom(uid,email,data,profile){
    data=data||{};
    return {
      uid:uid,email:email||data.email||'',displayName:profile.name,profileAvatar:profile.avatar,
      bio:String(data.bio||profile.bio||'').slice(0,280),
      plan:data.plan||data.currentPlan||(data.premium?'VIP':'Free'),
      currentPlan:data.currentPlan||data.plan||(data.premium?'VIP':'Free'),
      premium:data.premium===true
    };
  }
  function friendlyError(error){
    var code=String(error&&error.code||'');
    if(/invalid-credential|wrong-password|user-not-found/.test(code))return 'E-mail ou senha incorretos. Se sua conta é antiga, conclua primeiro a importação descrita na pasta regras.';
    if(code==='auth/email-already-in-use')return 'Este e-mail já está cadastrado. Tente entrar.';
    if(code==='auth/weak-password')return 'Use uma senha mais forte, com pelo menos 6 caracteres.';
    if(code==='auth/invalid-email')return 'E-mail inválido.';
    if(code==='auth/operation-not-allowed')return 'Ative o provedor E-mail/Senha no Firebase anime.';
    if(code==='auth/too-many-requests')return 'Muitas tentativas. Aguarde alguns minutos e tente novamente.';
    if(code==='auth/network-request-failed')return 'Falha de conexão com o Firebase. Confira sua internet.';
    return error&&error.message?error.message:'Erro ao autenticar. Tente novamente.';
  }
  (function checkExisting(){
    if(!ensureInit())return;
    firebase.auth().onAuthStateChanged(function(user){if(user&&!submitting)location.replace('index.html');});
  })();

  document.getElementById('forgot').addEventListener('click', async function(e){
    e.preventDefault();
    if (!ensureInit()) { show('err','Firebase carregando… tente novamente em 1s.'); return; }
    var email = em.value.trim().toLowerCase();
    if (!email) { show('err','Digite seu e-mail acima para redefinir a senha.'); em.focus(); return; }
    try {
      await firebase.auth().sendPasswordResetEmail(email);
      show('ok','Enviamos o link de redefinição para seu e-mail. Confira também a caixa de spam.');
    } catch(err){ show('err',friendlyError(err)); }
  });

  document.getElementById('form').addEventListener('submit', async function(e){
    e.preventDefault();
    if (!ensureInit()) { show('err','Firebase não carregou. Recarregue a página.'); return; }
    var email = em.value.trim().toLowerCase();
    var pass  = pw.value;
    if (!email || !/.+@.+\..+/.test(email)) { show('err','E-mail inválido.'); return; }
    if (!pass || pass.length < 6) { show('err','A senha deve ter pelo menos 6 caracteres.'); return; }
    if (mode === 'signup' && !firstName.value.trim()) { show('err','Informe seu nome para criar a conta.'); firstName.focus(); return; }
    var signupAvatarLink=DEFAULT_AVATAR;
    if(mode==='signup'&&avatarUrl.value.trim()){
      signupAvatarLink=safeAvatarUrl(avatarUrl.value);
      if(!signupAvatarLink){show('err','Informe um link válido para a foto, começando com http:// ou https://.');avatarUrl.focus();return;}
    }

    btn.disabled = true; btn.classList.add('loading'); msg.className = 'msg';submitting=true;
    var createdUser=null;
    try {
      var uid = '';
      var ref = null;
      var data = null;

      if (mode === 'signup') {
        var credential=await firebase.auth().createUserWithEmailAndPassword(email,pass);
        createdUser=credential.user;
        uid=createdUser.uid;
        ref = firebase.database().ref('users/' + uid);
        var full = (document.getElementById('firstname').value || '').trim().slice(0,24);
        selectedAvatar=signupAvatarLink;
        var primaryProfile = {id:'principal',name:full,avatar:selectedAvatar,bio:'',banner:'default',theme:'blue'};
        await ref.set({
          uid: uid, email: email, displayName: full,
          profileName:full,profileAvatar:selectedAvatar,profile:primaryProfile,profiles:[primaryProfile],
          bio: '', banned: false,
          plan: 'Free', currentPlan: 'Free', premium: false,
          createdAt: firebase.database.ServerValue.TIMESTAMP,
          lastLogin: firebase.database.ServerValue.TIMESTAMP
        });
        await createdUser.updateProfile({displayName:full,photoURL:/^https:\/\//i.test(selectedAvatar)?selectedAvatar:null});
        localStorage.setItem('dk_session',JSON.stringify(sessionFrom(uid,email,{plan:'Free',currentPlan:'Free'},primaryProfile)));
        activateSingleProfile(uid,primaryProfile);
      } else {
        var signed=await firebase.auth().signInWithEmailAndPassword(email,pass);
        uid=signed.user.uid;
        ref = firebase.database().ref('users/' + uid);
        var snapshot=await ref.once('value');
        data=snapshot.val();
        if(!data)throw new Error('A conta foi autenticada, mas o perfil não foi encontrado. Importe as contas antigas antes de publicar as regras.');
        if (data.banned === true) throw new Error('Esta conta foi banida. Entre em contato com o suporte.');
        var primaryProfile = singleProfile(data);
        await ref.update({
          lastLogin:firebase.database.ServerValue.TIMESTAMP,
          displayName:primaryProfile.name,profileName:primaryProfile.name,profileAvatar:primaryProfile.avatar,
          profile:primaryProfile,profiles:[primaryProfile],passwordHash:null
        });
        localStorage.setItem('dk_session',JSON.stringify(sessionFrom(uid,signed.user.email||email,data,primaryProfile)));
        activateSingleProfile(uid,primaryProfile);
      }

      show('ok','Sucesso! Redirecionando…');
      setTimeout(function(){ location.replace('index.html'); }, 400);

    } catch(err){
      if(createdUser){try{await createdUser.delete();}catch(ignore){}}
      else if(firebase.auth().currentUser){try{await firebase.auth().signOut();}catch(ignore){}}
      submitting=false;
      show('err',friendlyError(err));
      btn.disabled = false; btn.classList.remove('loading');
    }
  });
})();
</script>
</body>
</html>
