                            var profileListKey = 'dk_profiles_' + String(sessionForNick.uid || 'anon');
                            var profileList = JSON.parse(localStorage.getItem(profileListKey) || '[]');
                            if (Array.isArray(profileList)) {
                                profileList.forEach(function(item){
                                    if (item && item.id === activeNick.id) item.name = value;
                                });
                                localStorage.setItem(profileListKey,JSON.stringify(profileList));
                            }
                            if (window.RabbitHubProfileData && window.RabbitHubProfileData.syncPublicProfile) {
                                window.RabbitHubProfileData.syncPublicProfile({
                                    profileName:value,
                                    profileAvatar:activeNick.avatar || '',
                                    bio:activeNick.bio || ''
                                });
                            }
                        }
                        if (nickStatus) { nickStatus.className = 'account-inline-status success'; nickStatus.textContent = 'Nick salvo.'; }
                    } catch(e) {
                        if (nickStatus) { nickStatus.className = 'account-inline-status error'; nickStatus.textContent = 'Não foi possível salvar agora.'; }
                    }
                });
            }
            var resetButton = sheetBody.querySelector('#account-password-reset');
            var status = sheetBody.querySelector('#account-password-status');
            if (!resetButton) return;
            resetButton.addEventListener('click',function(){
                var email = resetButton.getAttribute('data-account-email') || '';
                if (!email || email === 'Não informado') {
                    if (status) { status.className = 'account-inline-status error'; status.textContent = 'Não encontramos um e-mail válido para enviar a solicitação.'; }
                    return;
                }
                resetButton.disabled = true;
                var resetLabel = resetButton.querySelector('span');
                if (resetLabel) resetLabel.textContent = 'Enviando...';
                if (status) { status.className = 'account-inline-status'; status.textContent = ''; }
                var service = window.RabbitHubProfileData;
                if (!service || typeof service.submitSupportRequest !== 'function') {
                    resetButton.disabled = false;
                    if (resetLabel) resetLabel.textContent = 'Trocar senha';
                    if (status) { status.className = 'account-inline-status error'; status.textContent = 'Não foi possível abrir a solicitação agora.'; }
                    return;
                }
                service.submitSupportRequest({
                    type:'senha',
                    subject:'Solicitação de nova senha',
                    message:'Solicito instruções para redefinir a senha da minha conta.',
                    contact:email
                }).then(function(){
                    resetButton.disabled = false;
                    if (resetLabel) resetLabel.textContent = 'Solicitação enviada';
                    if (status) { status.className = 'account-inline-status success'; status.textContent = 'Solicitação enviada. A equipe entrará em contato pelo e-mail da conta.'; }
                }).catch(function(){
                    resetButton.disabled = false;
                    if (resetLabel) resetLabel.textContent = 'Trocar senha';
                    if (status) { status.className = 'account-inline-status error'; status.textContent = 'Não foi possível enviar agora. Tente novamente em instantes.'; }
                });
            });
        }

        function openSheet(kind){
            var titles = { lista:'Minha Lista', favoritos:'Minha Lista', historico:'Histórico', planos:'Planos', config:'Configurações', conta:'Conta', suporte:'Suporte', pedidos:'Suporte' };
            sheetTitle.textContent = titles[kind] || '';
            if (kind === 'lista' || kind === 'favoritos') sheetBody.innerHTML = renderMinhaLista();
            else if (kind === 'historico') sheetBody.innerHTML = renderHistorico();
            else if (kind === 'planos') sheetBody.innerHTML = renderPlanos();
            else if (kind === 'config') sheetBody.innerHTML = renderConfig();
            else if (kind === 'conta') sheetBody.innerHTML = renderSheetLoading('Carregando seus dados...');
            else if (kind === 'suporte' || kind === 'pedidos') sheetBody.innerHTML = renderSuporte();
            sheet.classList.toggle('yc-config-dialog',kind === 'config');
            sheet.classList.toggle('yc-account-dialog',kind === 'conta');
            if (kind === 'config' || kind === 'conta') {
                sheet.setAttribute('role','dialog');
                sheet.setAttribute('aria-modal','true');
            } else {
                sheet.removeAttribute('role');
                sheet.removeAttribute('aria-modal');
            }
            sheet.classList.add('open');
            // handlers dentro do sheet
            bindHistoryClear();
            if (kind === 'lista' || kind === 'favoritos') bindMinhaLista();
            var configClose = sheetBody.querySelector('#yc-config-close');
            if (configClose) configClose.addEventListener('click',closeSheet);
            if (kind === 'conta') bindAccountActions();
            if (kind === 'historico' && window.RabbitHubProfileData) {
                window.RabbitHubProfileData.refreshHistory().then(function(latest){
                    if (!sheet.classList.contains('open') || sheetTitle.textContent !== 'Histórico') return;
                    hist = latest;
                    sheetBody.innerHTML = renderHistorico();
                    bindHistoryClear();
                });
            }
            function bindToggle(id, key){
                var el = sheetBody.querySelector('#'+id);
                if (!el) return;
                el.addEventListener('click', function(){
                    var on = el.classList.toggle('on');
                    el.setAttribute('aria-checked', on?'true':'false');
                    localStorage.setItem(key, on?'1':'0');
                    if (key === 'rh_transitions') document.documentElement.setAttribute('data-rh-transitions', on ? 'on' : 'off');
                    if (key === 'rh_reduce_motion') document.documentElement.setAttribute('data-rh-reduced-motion', on ? 'on' : 'off');
                });
            }
            bindToggle('cfg-transitions', 'rh_transitions');
            bindToggle('cfg-reduce-motion', 'rh_reduce_motion');
            function bindPreferenceToggle(id,field,locked){
                var toggle=sheetBody.querySelector('#'+id);
                if(!toggle)return;
                toggle.addEventListener('click',function(){
                    if(locked){
                        var status=sheetBody.querySelector('#cfg-backup-status');
                        if(status)status.textContent='Este recurso precisa do plano VIP.';
                        return;
                    }
                    var on=toggle.classList.toggle('on');
                    toggle.setAttribute('aria-checked',on?'true':'false');
                    if(window.RabbitHubFeatures){var patch={};patch[field]=on;window.RabbitHubFeatures.savePreferences(patch);}
                });
            }
            bindPreferenceToggle('cfg-block-adult','blockAdult',false);
            bindPreferenceToggle('cfg-ai-fillers','aiFillers',false);
            bindPreferenceToggle('cfg-ai-skip','aiSkip',!(window.RabbitHubPlans&&window.RabbitHubPlans.can&&window.RabbitHubPlans.can('skipSegments')));
            var genreBox=sheetBody.querySelector('#cfg-content-genres');
            if(genreBox)genreBox.addEventListener('click',function(event){
                var button=event.target.closest('[data-content-genre]');if(!button)return;
                button.classList.toggle('active');button.setAttribute('aria-pressed',button.classList.contains('active')?'true':'false');
                var hidden=Array.prototype.map.call(genreBox.querySelectorAll('[data-content-genre].active'),function(item){return String(item.getAttribute('data-content-genre')||'').toLocaleLowerCase('pt-BR');});
                if(window.RabbitHubFeatures)window.RabbitHubFeatures.savePreferences({hiddenGenres:hidden});
            });
            var backupStatus=sheetBody.querySelector('#cfg-backup-status');
            function backupMessage(message,error){if(backupStatus){backupStatus.textContent=message;backupStatus.classList.toggle('is-error',!!error);}}
            function backupJob(button,promise,success){
                if(!button)return;button.disabled=true;backupMessage('Processando backup...',false);
                Promise.resolve(promise).then(function(){backupMessage(success,false);}).catch(function(error){backupMessage(error&&error.message||'Não foi possível concluir.',true);}).then(function(){button.disabled=false;});
            }
            var backupCloud=sheetBody.querySelector('#cfg-backup-cloud');
            if(backupCloud)backupCloud.addEventListener('click',function(){backupJob(backupCloud,window.RabbitHubFeatures.saveCloudBackup(),'Backup salvo na sua conta.');});
            var backupRestore=sheetBody.querySelector('#cfg-backup-restore');
            if(backupRestore)backupRestore.addEventListener('click',function(){if(confirm('Restaurar o backup da nuvem e substituir os dados atuais deste perfil?'))backupJob(backupRestore,window.RabbitHubFeatures.restoreCloudBackup(),'Backup restaurado. Reabra a tela para conferir.');});
            var backupDownload=sheetBody.querySelector('#cfg-backup-download');
            if(backupDownload)backupDownload.addEventListener('click',function(){try{var result=window.RabbitHubFeatures.downloadBackup();backupMessage(result&&result.native?'Escolha onde salvar o arquivo no Android.':'Arquivo de backup baixado.',false);}catch(error){backupMessage(error.message,true);}});
            var backupImport=sheetBody.querySelector('#cfg-backup-import');
            var backupFile=sheetBody.querySelector('#cfg-backup-file');
            if(backupImport&&backupFile){
                backupImport.addEventListener('click',function(){backupFile.value='';backupFile.click();});
                backupFile.addEventListener('change',function(){
                    var file=backupFile.files&&backupFile.files[0];if(!file)return;
                    window.RabbitHubFeatures.readBackupFile(file).then(function(data){
                        if(!confirm('Importar este arquivo e substituir os dados atuais deste perfil?'))return null;
                        return window.RabbitHubFeatures.restoreBackup(data);
                    }).then(function(result){if(result)backupMessage('Arquivo importado com sucesso.',false);}).catch(function(error){backupMessage(error.message,true);});
                });
            }
            var drawerModeToggle = sheetBody.querySelector('#cfg-drawer-fixed');
            if (drawerModeToggle) drawerModeToggle.addEventListener('click',function(){
                var fixed = drawerModeToggle.classList.toggle('on');
                drawerModeToggle.setAttribute('aria-checked',fixed?'true':'false');
                if (window.RabbitHubDrawer && window.RabbitHubDrawer.setMode) window.RabbitHubDrawer.setMode(fixed?'fixed':'overlay');
                else {
                    localStorage.setItem('rh_drawer_mode',fixed?'fixed':'overlay');
                    document.documentElement.setAttribute('data-rh-drawer-mode',fixed?'fixed':'overlay');
                }
            });
            if (kind === 'planos') bindPlanRequests();
            if (kind === 'suporte' || kind === 'pedidos') bindSupportContacts();
            // Grade de cores
            var themeGrid = sheetBody.querySelector('#theme-color-grid');
            if (themeGrid && window.DK_THEMES){
                var access = window.RabbitHubPlans && window.RabbitHubPlans.get ? window.RabbitHubPlans.get() : {customTheme:false};
                var canChangeTheme = access.customTheme === true;
                var pendingTheme = canChangeTheme ? window.DK_getTheme() : 'blue';
                function paintThemes(){
                    themeGrid.innerHTML = '';
                    Object.keys(window.DK_THEMES).forEach(function(k){
                        var t = window.DK_THEMES[k];
                        var el = document.createElement('button');
                        el.type = 'button'; el.title = 'Usar tema ' + t.name;
                        el.className = 'theme-swatch' + (k===pendingTheme?' active':'') + (!canChangeTheme && k !== 'blue' ? ' locked':'');
                        el.style.background = 'linear-gradient(145deg,' + t.brand + ',' + t.brand2 + ')';
                        el.setAttribute('aria-pressed', k===pendingTheme?'true':'false');
                        el.innerHTML = '<span>' + t.name + '</span><span class="theme-swatch-check">✓</span>';
                        el.disabled = !canChangeTheme;
                        el.onclick = function(){ pendingTheme = k; paintThemes(); };
                        themeGrid.appendChild(el);
                    });
                }
                paintThemes();
                var applyThemeBtn = sheetBody.querySelector('#cfg-apply-theme');
                if (applyThemeBtn && canChangeTheme) applyThemeBtn.addEventListener('click', function(){
                    applyThemeBtn.disabled = true;
                    applyThemeBtn.textContent = 'Aplicando...';
                    if (window.DK_setTheme(pendingTheme, true) === false) {
                        applyThemeBtn.disabled = false;
                        applyThemeBtn.textContent = 'Aplicar tema';
                    }
                });
            }
            // Banners disponibilizados pelo RabbitHub.
            var profileBannerGrid = sheetBody.querySelector('#profile-banner-grid');
            if (profileBannerGrid){
                var profileAccess = window.RabbitHubPlans && window.RabbitHubPlans.get ? window.RabbitHubPlans.get() : {customTheme:false};
                var canCustomizeProfile = profileAccess.customTheme === true;
                var pendingVisual = readProfileVisual();
                var bannerFilter = sheetBody.querySelector('#profile-banner-filter');
                var bannerEmpty = sheetBody.querySelector('#profile-banner-empty');
                var bannerStatus = sheetBody.querySelector('#profile-banner-status');
                var bannerSaveGeneration = 0;
                function paintProfileBanners(){
                    var filter = bannerFilter ? bannerFilter.value : 'all';
                    var visibleCount = 0;
                    profileBannerGrid.querySelectorAll('[data-profile-banner]').forEach(function(button){
                        var item = profileBannerData(button.getAttribute('data-profile-banner'));
                        var selected = item.key === pendingVisual.banner;
                        var visible = filter === 'all' || item.type === filter;
                        var thumb = button.querySelector('.profile-banner-thumb');
                        button.hidden = !visible;
                        if (visible) visibleCount++;
                        button.classList.toggle('active',selected);
                        button.setAttribute('aria-pressed',selected ? 'true' : 'false');
                        button.disabled = !canCustomizeProfile && !selected;
                        if (thumb && item.url) thumb.style.backgroundImage = 'linear-gradient(110deg,rgba(5,8,14,.08),rgba(5,8,14,.68)),url("' + item.url.replace(/["\\\r\n]/g,'') + '")';
                    });
                    if (bannerEmpty) bannerEmpty.hidden = visibleCount > 0;
                }
                profileBannerGrid.querySelectorAll('[data-profile-banner]').forEach(function(button){
                    button.addEventListener('click',function(){
                        if (!canCustomizeProfile) return;
                        pendingVisual.banner = button.getAttribute('data-profile-banner') || 'default';
                        var requestedVisual = {banner:pendingVisual.banner};
                        var saveGeneration = ++bannerSaveGeneration;
                        if (bannerStatus) {
                            bannerStatus.textContent = 'Salvando banner na sua conta...';
                            bannerStatus.className = 'profile-banner-status is-pending';
                        }
                        saveProfileVisual(requestedVisual).then(function(result){
                            if (saveGeneration !== bannerSaveGeneration) return;
                            if (result && result.value) {
                                pendingVisual.banner = result.value.banner || requestedVisual.banner;
                                applyProfileVisualToCard(pendingVisual);
                            }
                            if (!bannerStatus) return;
                            bannerStatus.textContent = result && result.synced
                                ? 'Banner salvo na sua conta'
                                : 'Não foi possível salvar o banner na conta';
                            bannerStatus.className = 'profile-banner-status ' + (result && result.synced ? 'is-saved' : 'is-error');
                        }).catch(function(){
                            if (saveGeneration !== bannerSaveGeneration || !bannerStatus) return;
                            bannerStatus.textContent = 'Não foi possível sincronizar o banner';
                            bannerStatus.className = 'profile-banner-status is-error';
                        });
                        applyProfileVisualToCard(pendingVisual);
                        paintProfileBanners();
                    });
                });
                if (bannerFilter) bannerFilter.addEventListener('change',paintProfileBanners);
                paintProfileBanners();
            }
        }

        var profileBioInput = document.getElementById('yc-profile-bio');
        var profileBioSave = document.getElementById('yc-profile-bio-save');
        var profileBioStatus = document.getElementById('yc-profile-bio-status');
        if (profileBioInput && profileBioSave) {
            var profileBioDirty = false;
            if (window.RabbitHubProfileData && window.RabbitHubProfileData.getBio) {
                window.RabbitHubProfileData.getBio().then(function(savedBio){
                    if (!profileBioInput.isConnected || profileBioDirty) return;
                    profileBioInput.value = String(savedBio || '').slice(0,280);
                    if (profileBioStatus) profileBioStatus.textContent = profileBioInput.value.length + '/280 caracteres';
                });
            }
            profileBioInput.addEventListener('input',function(){
                profileBioDirty = true;
                if (profileBioStatus) {
                    profileBioStatus.textContent = profileBioInput.value.length + '/280 caracteres';
                    profileBioStatus.className = '';
                }
            });
            profileBioSave.addEventListener('click',function(){
                var bioValue = profileBioInput.value.trim().slice(0,280);
                profile.bio = bioValue;
                saveProfile(profile);
                profileBioSave.disabled = true;
                profileBioSave.textContent = 'Salvando...';
                if (profileBioStatus) {
                    profileBioStatus.textContent = 'Salvando na sua conta...';
                    profileBioStatus.className = 'is-pending';
                }

                var request = window.RabbitHubProfileData && window.RabbitHubProfileData.saveBio
                    ? window.RabbitHubProfileData.saveBio(bioValue)
                    : Promise.resolve({bio:bioValue,synced:false});
                request.then(function(result){
                    profileBioDirty = false;
                    if (!profileBioStatus) return;
                    profileBioStatus.textContent = result && result.synced
                        ? 'Bio salva na sua conta'
                        : 'Bio salva; sincronização pendente';
                    profileBioStatus.className = result && result.synced ? 'is-saved' : 'is-pending';
                }).catch(function(){
                    if (!profileBioStatus) return;
                    profileBioStatus.textContent = 'Não foi possível sincronizar a bio';
                    profileBioStatus.className = 'is-error';
                }).then(function(){
                    profileBioSave.disabled = false;
                    profileBioSave.textContent = 'Salvar bio';
                    window.setTimeout(function(){
                        if (profileBioStatus && profileBioStatus.className !== 'is-error') {
                            profileBioStatus.textContent = profileBioInput.value.length + '/280 caracteres';
                            profileBioStatus.className = '';
                        }
                    },2200);
                });
            });
        }

        // Bind tiles
        main.querySelectorAll('[data-yc-open]').forEach(function(b){
            b.addEventListener('click', function(){ openSheet(b.getAttribute('data-yc-open')); });
        });
        main.querySelectorAll('[data-yc-action]').forEach(function(b){
            b.addEventListener('click', function(){
                var act = b.getAttribute('data-yc-action');
                if (act === 'conta'){
                    openSheet('conta');
                    if (window.RabbitHubProfileData) {
                        window.RabbitHubProfileData.getAccount().then(function(data){
                            if (sheet.classList.contains('open') && sheetTitle.textContent === 'Conta') {
                                sheetBody.innerHTML = renderAccount(data);
                                bindAccountActions();
                            }
                        });
                    } else {
                        var fallbackSession = {};
                        try { fallbackSession = JSON.parse(localStorage.getItem('dk_session') || '{}'); } catch(e){}
                        sheetBody.innerHTML = renderAccount({session:fallbackSession,profile:fallbackSession,user:{}});
                        bindAccountActions();
                    }
                } else if (act === 'notifications' || act === 'chat'){
                    location.href = 'chat.html';
                } else if (act === 'suporte' || act === 'pedidos'){
                    openSheet('suporte');
                }
            });
        });

    }


    // Permite abrir uma aba diretamente via ?tab=... (vindo do drawer das outras páginas)
    var _initialTab = 'home';
    try {
        var _qp = new URLSearchParams(window.location.search).get('tab');
        var _allowed = ['home','dublados','legendados','lancamentos','categoria','filmes-legendados','filmes-dublados','perfil'];
        if (_qp && _allowed.indexOf(_qp) !== -1) _initialTab = _qp;
    } catch(e) {}
    subscribeHomeFeatured();
    renderMain(_initialTab);
    document.addEventListener('rh:historychange', function(){
        if (activeTab === 'perfil' && !document.querySelector('.yc-sheet.open')) renderPerfil();
    });
    document.addEventListener('rh:planchange', function(){
        if (activeTab === 'perfil' && !document.querySelector('.yc-sheet.open')) renderPerfil();
    });
    document.addEventListener('dk:userready', function(){
        if (activeTab === 'perfil') renderPerfil();
    });

    playFeaturedBtn.addEventListener('click', function() { if (featuredSlug) irParaDetalhes(featuredAnime || featuredSlug); });
    var detailsBtn = document.getElementById('details-featured');
    if (detailsBtn) detailsBtn.addEventListener('click', function() { if (featuredSlug) irParaDetalhes(featuredAnime || featuredSlug); });

    navItems.forEach(function(btn) {
        // O botão "Filmes" é apenas um toggle de submenu (sem data-tab) — tratado separadamente
        if (!btn.dataset.tab) return;
        btn.addEventListener('click', function() {
            renderMain(btn.dataset.tab);
            closeDrawer();
            searchBox.classList.remove('show');
            searchInput.value = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    });

    /* Filmes: toggle do submenu (não troca de tab por si só) */
    var filmesGroup = document.getElementById('drawer-group-filmes');
    var filmesToggle = document.getElementById('filmes-toggle');
    if (filmesToggle && filmesGroup) {
        filmesToggle.addEventListener('click', function(e) {
            e.preventDefault();
            var isOpen = filmesGroup.classList.toggle('open');
            filmesToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        });
    }

    /* Subitens Filmes (Legendados / Dublados) */
    var subNavItems = document.querySelectorAll('.drawer-subnav-item');
    subNavItems.forEach(function(btn) {
        btn.addEventListener('click', function() {
            // marcar ativo apenas dentro do submenu
            subNavItems.forEach(function(b){ b.classList.remove('active'); });
            btn.classList.add('active');
            // remover active dos itens principais (estamos numa sub-tab)
            navItems.forEach(function(n) { n.classList.remove('active'); });
            renderMain(btn.dataset.tab);
            closeDrawer();
            searchBox.classList.remove('show');
            searchInput.value = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    });

    function restoreActiveView() {
        hideAllPaginations();
        if (activeTab === 'home') renderMain('home');
        else if (activeTab === 'dublados') carregarDublados(scraperPage);
        else if (activeTab === 'legendados') carregarLegendados(scraperLegendadosPage);
        else if (activeTab === 'lancamentos') carregarLancamentos(scraperLancamentosPage);
        else if (activeTab === 'filmes-legendados') carregarFilmesLegendados(scraperFilmesLegPage);
        else if (activeTab === 'filmes-dublados') carregarFilmesDublados(scraperFilmesDubPage);
        else if (activeTab === 'categoria' && selectedGenero) carregarGenero(selectedGenero, scraperCatPage, selectedGeneroNome);
        else renderMain(activeTab);
    }
    function closeSearchAndRestore() {
        clearTimeout(searchTimeout);
        viewRequestId++;
        searchBox.classList.remove('show');
        openSearchBtn.setAttribute('aria-expanded', 'false');
        openSearchBtn.setAttribute('aria-label', 'Abrir pesquisa');
        searchInput.value = '';
        if (searchAssist) searchAssist.hidden = true;
        restoreActiveView();
        openSearchBtn.focus();
    }
    openSearchBtn.addEventListener('click', function() {
        if (searchBox.classList.contains('show')) {
            closeSearchAndRestore();
        } else {
            searchBox.classList.add('show');
            openSearchBtn.setAttribute('aria-expanded', 'true');
            openSearchBtn.setAttribute('aria-label', 'Fechar pesquisa');
            searchInput.value = '';
            searchInput.focus();
            renderSearchAssist([], '');
        }
    });

    if (searchAssist) searchAssist.addEventListener('click',function(event){
        var suggestion=event.target.closest('[data-search-suggestion]');
        if(suggestion){
            searchInput.value=suggestion.getAttribute('data-search-suggestion')||'';
            searchInput.dispatchEvent(new Event('input',{bubbles:true}));
            searchInput.focus();
            return;
        }
        if(event.target.closest('[data-search-clear]')){
            localStorage.removeItem(recentSearchKey());
            renderSearchAssist([], '');
        }
    });

    /* pesquisa via AF.pesquisar */

    function getSearchTitle() {
        /* A pesquisa nativa do WordPress é global. O título precisa refletir
           o conjunto realmente consultado, independentemente da aba aberta. */
        return 'Resultados gerais';
    }

    searchInput.addEventListener('input', function(e) {
        clearTimeout(searchTimeout);
        var q = (e.target.value || '').trim();
        searchTimeout = setTimeout(async function() {
            if (!q) {
                viewRequestId++;
                renderSearchAssist([], '');
                restoreActiveView();
                return;
            }

            var requestId = ++viewRequestId;
            var baseTitle = getSearchTitle();
            main.innerHTML = '<div class="loading">Pesquisando "' + escapeAnimeHtml(q) + '"...</div>';
            hideAllPaginations();
            heroSection.style.display = 'none';

            try {
                var data = await AF.pesquisar(q);
                if (requestId !== viewRequestId) return;
                if(window.RabbitHubFeatures)data=window.RabbitHubFeatures.filterAnimeList(data);

                main.innerHTML = '';
                if (!data || data.length === 0) {
                    renderSearchAssist([],q);
                    main.innerHTML = '<div class="no-results">Nenhum resultado para "' + escapeAnimeHtml(q) + '"</div>';
                } else {
                    saveRecentSearch(q);
                    renderSearchAssist(data,q);
                    var header = document.createElement('div');
                    header.className = 'section-header';
                    header.innerHTML = '<div class="section-bar"></div><h3 class="section-title">' + baseTitle + ' para "' + escapeAnimeHtml(q) + '" (' + data.length + ')</h3>';
                    main.appendChild(header);
                    main.appendChild(renderScraperCards(data, 'Pesquisa'));
                }
            } catch(err) {
                console.error(err);
                if (requestId === viewRequestId) {
                    if(searchAssist)searchAssist.hidden=true;
                    main.innerHTML = '<div class="no-results" role="alert" style="color:#ff8f96;">Não foi possível concluir a pesquisa. Tente novamente em instantes.</div>';
                }
            }
        }, 350);
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            if (searchBox.classList.contains('show')) {
                closeSearchAndRestore();
            }
            if (drawer.classList.contains('open')) closeDrawer();
        }
    });
    document.addEventListener('rh:planchange',function(){
        if(searchBox.classList.contains('show')) renderSearchAssist([],searchInput.value.trim());
    });
    </script>

</body>
</html>
